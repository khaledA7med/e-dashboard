<div class="rounded-2xl bg-white p-5 shadow-sm">
    <!-- Header -->
    <h3 class="mb-4 text-base font-semibold text-gray-900">
        {{ title }}
    </h3>

    <!-- List -->
    <div class="space-y-2 max-h-[140px] overflow-y-auto pr-1">

        <!-- TOP SELLING -->
        @if (isTop()) {
        @for (p of viewTopSelling; let i = $index; track p._id) {
        <div class="flex items-center justify-between rounded-lg px-3 py-2 text-sm" [class.bg-[#FBF3DD]]="i === 0"
            [class.bg-gray-50]="i !== 0">
            <!-- Left -->
            <div class="min-w-0">
                <div class="truncate font-medium text-gray-900">
                    {{ p.title }}
                    <span class="text-gray-600 font-normal">
                        ({{ p.price | currency:'EGP':'symbol':'1.0-0' }})
                    </span>
                </div>
            </div>

            <!-- Right -->
            <div class="text-xs font-semibold text-gray-800 whitespace-nowrap">
                {{ p.sold }} Sales
            </div>
        </div>
        }
        }

        <!-- LOW STOCK -->
        @if (isLow()) {
        @for (p of viewLowStock; track p._id) {
        <div class="flex items-center justify-between rounded-lg bg-gray-50 px-3 py-2 text-sm">
            <!-- Left -->
            <div class="min-w-0">
                <div class="truncate font-medium text-gray-900">
                    {{ p.title }}
                </div>
            </div>

            <!-- Right -->
            <div class="text-xs font-semibold whitespace-nowrap" [class.text-red-500]="isCritical(p.quantity)"
                [class.text-gray-700]="!isCritical(p.quantity)">
                {{ p.quantity }} Products
            </div>
        </div>
        }
        }

    </div>
</div>
